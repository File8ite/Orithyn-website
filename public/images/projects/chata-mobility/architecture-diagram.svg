<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <linearGradient id="chBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="chCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141424"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="660" fill="url(#chBg)"/>
  <rect x="1" y="1" width="998" height="658" fill="none" stroke="#1e2238" stroke-width="2"/>

  <!-- Top Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1"/>
    <text x="84" y="17" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">VERIFIED ARCHITECTURE</text>
    <text x="0" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">CHATA Mobility — Group Transit &amp; Charter Architecture</text>
    <text x="0" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">React 19 frontend, Express 4-layer backend architecture, and PostgreSQL transactions with row-level locks on group_trips</text>
  </g>

  <!-- COLUMN 1: PRESENTATION LAYER (LEFT) -->
  <g transform="translate(40, 130)">
    <rect width="280" height="500" rx="14" fill="url(#chCard)" stroke="#1e2238" stroke-width="1.5"/>
    <rect x="16" y="14" width="248" height="30" rx="6" fill="#1e2238"/>
    <text x="28" y="34" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🖥️ PRESENTATION (VITE / REACT 19)</text>

    <!-- Sub-block: React 19 Frontend -->
    <g transform="translate(16, 54)">
      <rect width="248" height="170" rx="8" fill="#0c0c16" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">React 19 &amp; Vite 8 Application</text>
      <text x="12" y="38" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Tailwind CSS 4 &amp; Framer Motion</text>
      <text x="12" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• HomePage (Group Transit Marketplace)</text>
      <text x="12" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• BrowseTripsPage (Route &amp; Destination search)</text>
      <text x="12" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• CreateTripPage (Host a charter / pooling ride)</text>
      <text x="12" y="114" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Auth Gates (Login / Register / LocalStorage JWT)</text>
      <text x="12" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Partner &amp; Operator Onboarding views</text>
      <text x="12" y="154" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ Verified in frontend/src/App.tsx</text>
    </g>

    <!-- Sub-block: Client Flow -->
    <g transform="translate(16, 234)">
      <rect width="248" height="250" rx="8" fill="#0c0c16" stroke="#2a2e48" stroke-width="1"/>
      <text x="12" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Client Routing &amp; State</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">PushState-based View Controller</text>
      <text x="12" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• URL path sync ('/browse', '/create-trip')</text>
      <text x="12" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• User session parsed from localStorage</text>
      <text x="12" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Smooth-scroll section navigation</text>
      <text x="12" y="116" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Optimistic state updates for user actions</text>
      <rect x="12" y="136" width="224" height="66" rx="6" fill="#1e2238"/>
      <text x="22" y="156" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Target Operational Domain</text>
      <text x="22" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">High-density African transit corridors</text>
      <text x="22" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">(e.g. Aba, Port Harcourt, Enugu)</text>
      <text x="12" y="234" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ Verified in Frontend Code</text>
    </g>
  </g>

  <!-- COLUMN 2: 4-LAYER EXPRESS BACKEND (CENTER) -->
  <g transform="translate(360, 130)">
    <rect width="290" height="500" rx="14" fill="url(#chCard)" stroke="#1e2238" stroke-width="1.5"/>
    <rect x="16" y="14" width="258" height="30" rx="6" fill="#1e2238"/>
    <text x="28" y="34" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⚙️ 4-LAYER EXPRESS.JS BACKEND</text>

    <!-- 4 Tiers of API -->
    <g transform="translate(16, 54)">
      <!-- Tier 1: Routes -->
      <rect x="0" y="0" width="258" height="74" rx="8" fill="#0c0c16" stroke="#3b82f6" stroke-width="1"/>
      <text x="12" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">1. Route Handlers &amp; Auth</text>
      <text x="12" y="34" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10">Express routes + JWT auth middleware</text>
      <text x="12" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Modules: auth, groupTrips, bids, bookings, chat</text>
      <text x="12" y="64" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Verified in backend/src/modules/</text>

      <!-- Tier 2: Controllers -->
      <rect x="0" y="84" width="258" height="74" rx="8" fill="#0c0c16" stroke="#2a2e48" stroke-width="1"/>
      <text x="12" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">2. Controllers Layer</text>
      <text x="12" y="118" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10">HTTP payload parsing &amp; error mapping</text>
      <text x="12" y="134" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Validates trip inputs, seat counts, ticket codes</text>
      <text x="12" y="148" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Verified in *.controller.js</text>

      <!-- Tier 3: Services -->
      <rect x="0" y="168" width="258" height="120" rx="8" fill="#0c0c16" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="12" y="186" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">3. Services (Domain Logic)</text>
      <text x="12" y="202" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">bookings.service.js</text>
      <text x="12" y="220" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Explicit BEGIN ... COMMIT / ROLLBACK</text>
      <text x="12" y="236" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Calculates available seats dynamically</text>
      <text x="12" y="252" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Auto-updates trip status to 'full'</text>
      <text x="12" y="270" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Transactional Booking Engine</text>

      <!-- Tier 4: Repositories & Pool -->
      <rect x="0" y="298" width="258" height="132" rx="8" fill="#0c0c16" stroke="#2a2e48" stroke-width="1"/>
      <text x="12" y="316" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">4. Repositories &amp; SQL Pool</text>
      <text x="12" y="332" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10">backend/src/config/db.js (node-pg)</text>
      <text x="12" y="352" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Parameterized SQL query execution ($1, $2)</text>
      <text x="12" y="368" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• PostgreSQL connection pool lifecycle</text>
      <text x="12" y="384" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Client check-out &amp; release handling</text>
      <text x="12" y="408" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Verified in Repository Files</text>
    </g>
  </g>

  <!-- COLUMN 3: DATABASE & CONCURRENCY (RIGHT) -->
  <g transform="translate(690, 130)">
    <rect width="270" height="500" rx="14" fill="url(#chCard)" stroke="#1e2238" stroke-width="1.5"/>
    <rect x="16" y="14" width="238" height="30" rx="6" fill="#1e2238"/>
    <text x="28" y="34" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🗄️ VERIFIED POSTGRESQL SCHEMA</text>

    <!-- Sub-block: Concurrency Control -->
    <g transform="translate(16, 54)">
      <rect width="238" height="130" rx="8" fill="#0c0c16" stroke="#10b981" stroke-width="1.2"/>
      <text x="12" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Booking Concurrency Control</text>
      <text x="12" y="36" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Row-Level Locks on group_trips</text>
      <text x="12" y="56" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">SELECT * FROM group_trips ... FOR UPDATE</text>
      <text x="12" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Locks target trip during seat check</text>
      <text x="12" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Serializes competing passenger checkouts</text>
      <text x="12" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Atomic rollback if requested &gt; available</text>
      <text x="12" y="120" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Verified in bookings.service.js:27</text>
    </g>

    <!-- Sub-block: 9 Verified Schema Tables -->
    <g transform="translate(16, 194)">
      <rect width="238" height="290" rx="8" fill="#0c0c16" stroke="#2a2e48" stroke-width="1"/>
      <text x="12" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Verified Relational Tables</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">database/schema.sql (Sprint 1)</text>
      
      <text x="12" y="58" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">1. users (id, name, email, phone, is_operator)</text>
      <text x="12" y="74" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">2. group_trips (origin, destination, seats, status)</text>
      <text x="12" y="90" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">3. trip_members (trip_id, user_id, joined_at)</text>
      <text x="12" y="106" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">4. trip_invitations (trip_id, invited_user, status)</text>
      <text x="12" y="122" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">5. bids (operator offers, vehicle capacity, price)</text>
      <text x="12" y="138" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">6. bookings (ticket_code, seats_booked, status)</text>
      <text x="12" y="154" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">7. chat_rooms (trip_id, traveler_id, operator_id)</text>
      <text x="12" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">8. chat_messages (room_id, sender_id, text)</text>
      <text x="12" y="186" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">9. waitlist (lead capture for new routes)</text>

      <rect x="12" y="200" width="214" height="48" rx="6" fill="#1e2238"/>
      <text x="20" y="216" fill="#eab308" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Reconciliation Resolution</text>
      <text x="20" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Tables buses, payments, reviews belong</text>
      <text x="20" y="242" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">to conceptual roadmap; above 9 are active.</text>
      <text x="12" y="274" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ 100% Code &amp; Schema Verified</text>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 320 180 L 360 180" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <path d="M 650 280 L 690 120" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <path d="M 650 360 L 690 320" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
</svg>
